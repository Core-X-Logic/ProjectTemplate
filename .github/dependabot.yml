# CI'daki `npm audit` kapısı bir zafiyeti YAKALAR ama güncellemez; `ci.yml` ayrıca OWASP
# bağımlılık taramasını "bu iş Dependabot'a ait" gerekçesiyle kapsam dışı bırakıyor.
# Dependabot olmadan bu, yarım kalmış bir karardı: kapı kırmızıya döner, kimse güncellemez.
#
# Sıklık ve limit ÖLÇÜME göre düşürüldü (2026-07-19). Önceki ayar haftalık × 3 ekosistem ×
# 5 PR = 15 açık PR üretti; her biri `ci.yml`'in 8 job'lık zincirini tetikliyordu ve
# dependabot'un kendi updater koşuları da ayrıca dakika yakıyordu. `ci.yml`'deki
# `github.actor != 'dependabot[bot]'` guard'ı CI tarafını kesiyor; buradaki aylık/3 ayarı
# PR akışının kendisini kesiyor. İkisi ayrı kaldıraç — biri diğerinin yerine geçmez.
version: 2
updates:
  - package-ecosystem: maven
    directory: /zero-spring/backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Major surumler planli migrasyon isidir, dependabot PR'i degil. Turetilmis projede
      # (kariora-perform) olculdu: ilk taramanin 6 PR'inin 4'u major'di ve dordu de merge
      # edilemezdi (Boot 4 framework migrasyonu, ShedLock 5->7, uyumsuz react-router ikilisi,
      # typescript-eslint peer araligiyla celisen TS 7). Ayni kural orada 2026-08-08'den beri.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      # Spring sürümleri birlikte hareket eder; tek tek PR bakım yükü üretir.
      spring:
        patterns: ['org.springframework*', 'org.springdoc*']
      test:
        patterns: ['org.testcontainers*', 'org.junit*', 'org.assertj*', 'com.icegreen*']

  - package-ecosystem: npm
    directory: /zero-spring/frontend/app
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Major surumler planli migrasyon isidir, dependabot PR'i degil. Turetilmis projede
      # (kariora-perform) olculdu: ilk taramanin 6 PR'inin 4'u major'di ve dordu de merge
      # edilemezdi (Boot 4 framework migrasyonu, ShedLock 5->7, uyumsuz react-router ikilisi,
      # typescript-eslint peer araligiyla celisen TS 7). Ayni kural orada 2026-08-08'den beri.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react*', 'react-router*']
      tooling:
        patterns: ['vite*', '@vitejs/*', 'typescript', 'vitest', '@testing-library/*']

  # Workflow'un kendi action'ları. Bu depoda action'lar sürüm etiketiyle sabitli
  # (@v4); SHA pinleme tercih edilirse Dependabot onu da günceller.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
