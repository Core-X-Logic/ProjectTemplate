name: CI

# Actions dakikası bu planda sınırlı bir kaynak (private repo). Bu zincir 9 job açıyor ve
# üçü Postgres ayağa kaldırıp jar boot ediyor, biri de container imajını build ediyor — yani
# tam bir koşu ucuz değil. `paths-ignore`
# bu yüzden var: bu depoda dokümantasyon commit'leri kod commit'lerinden daha sık ve bir
# markdown değişikliğinin Testcontainers suite'ini çalıştırması saf israf.
#
# DİKKAT — `paths-ignore` bir güvenlik kapısı DEĞİL: listelenen yollar CI'ın hiç okumadığı
# yollardır. Buraya CI'ın davranışını etkileyen bir şey (workflow dosyası, config, kaynak,
# Dockerfile) eklenirse gate sessizce atlanır ve "yeşil" görünür. Yeni satır eklemeden önce
# "CI bu dosyayı okuyor mu?" sorusunu cevaplayın.
#
# `workflow_dispatch`: doküman-only bir commit'ten sonra yine de tam zinciri koşturmak
# gerekirse (ya da release öncesi doğrulama için) elle tetiklemeye izin verir.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'zero-spring/docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'zero-spring/docs/**'
  workflow_dispatch:

# Sıralı prod release gate. Her job bir öncekine `needs` ile bağlı; herhangi biri
# düşerse zincirin geri kalanı hiç çalışmaz ve `release` job'ı asla tetiklenmez.
#
#   build → backend / frontend (test) → typed-client-drift → migration-drift → live-smoke
#         → security-checks ─┐
#   build → docker-build ────┴→ release   (release, security-checks VE docker-build'i bekler)
#
# ⚠️ BU DOSYANIN NEYİ GARANTİ ETMEDİĞİ — okumadan "gate" demeyin.
#
# Bu workflow uzun süre `zero-spring/.github/workflows/ci.yml` konumundaydı. GitHub Actions
# YALNIZCA repo kökündeki `.github/workflows/` dizinini okur, dolayısıyla **hiç koşmadı**:
# `gh api .../actions/runs --jq .total_count` → 0, kayıtlı workflow → 0, Actions ise açıktı.
# Yani "sıralı release gate" iddiası, içeriği doğru olduğu hâlde, konumu yüzünden boştu.
#
# İkinci ve HÂLÂ AÇIK olan sınırlama: bu repoda **branch protection kurulamıyor**.
#   gh api repos/.../branches/main/protection → 403 "Upgrade to GitHub Pro or make this
#   repository public"  (private repo + ücretsiz org planı; rulesets API'si de aynı 403)
# Sonuç: kırmızı bir check hiçbir merge'i veya push'u ENGELLEMEZ. `needs:` zinciri yalnızca
# *workflow içi* akışı sıralar — bir gate düşerse sonraki job'lar koşmaz, ama main'e push
# yine de mümkündür. "Hata release'i bloke eder" cümlesi bu plan altında DOĞRU DEĞİLDİR;
# blokaj şu an insan disiplinine bağlıdır. (Kayıt: RISK-REGISTER PROD-R23.)
#
# Job isimleri `backend` ve `frontend` yine de KASITLI olarak korunuyor: plan yükseltilip
# required status checks açıldığında bu isimlere referans verilecek.
#
# `defaults.run.working-directory: zero-spring` gizli bir sözleşme kurar: **`Checkout`'tan
# önce hiçbir `run:` adımı eklenemez**, çünkü o noktada `zero-spring` dizini henüz yoktur ve
# adım anında ölür. Şu an dokuz job'ın dokuzu da `Checkout` ile başlıyor.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tüm gate'lerde tek kaynaktan kullanılan CI Postgres koordinatları.
  DB_URL: jdbc:postgresql://localhost:5432/zero
  # RLS taban çizgisi kimlik ayrımı: uygulama app rolüyle, Flyway owner'la bağlanır.
  # `DB_USER` UYGULAMA kimliğidir; `zero` bırakılırsa jar'ı ayağa kaldıran gate'ler
  # (live-smoke, migration-boot, typed-client-drift) superuser olarak boot eder ve
  # RLS politikaları onları HİÇ kısıtlamaz — yani o gate'ler izolasyonu doğruluyor
  # görünürken hiçbir şey doğrulamaz (FORCE ROW LEVEL SECURITY owner'ı bağlar,
  # superuser'ı bağlamaz). Rolü ilk `flyway migrate` adımı V11 ile yaratır.
  DB_USER: zero_app
  DB_PASSWORD: zero_app_dev_password
  # Flyway kimliği: tablo/rol/politika yaratabilen owner. Ayrı kalmak ZORUNLU;
  # ikisi aynı olursa ayrımın kanıtı da (AppDbIdentityIT) anlamı da kalmaz.
  DB_MIGRATION_USER: postgres
  DB_MIGRATION_PASSWORD: postgres
  # Smoke gate'inin login olabilmesi için seed şifresi deterministik olmalı.
  # (prod profili kullanılmadığı için DataSeeder'ın fail-fast kontrolü tetiklenmez)
  SEED_ADMIN_PASSWORD: Ci-Smoke-Passw0rd!
  # C5: jar'ı ayağa kaldıran gate'ler AÇIKÇA dev profiliyle boot eder. Gerekçe:
  #  • /v3/api-docs artık yalnızca dev/test profillerinde anonim okunabilir. Kapı
  #    "prod değilse aç" idi ve profilsiz boot'ta AÇIK kalıyordu (fail-open); yön
  #    tersine çevrildi, base kapalı. typed-client-drift bu dokümanı okuduğu için
  #    profil artık zorunlu — belirtilmezse gate 401 alır.
  #  • Aynı şekilde live-smoke seed'lenmiş admin ile login oluyor ve base'de
  #    zero.seed.enabled=false (B4). dev profili ikisini de açıkça sağlar.
  # Yalnızca `java -jar` adımlarına verilir: `backend` job'ında maven testleri
  # kendi @ActiveProfiles'ını kullanır, oraya sızdırılmaz.
  SPRING_PROFILES_ACTIVE_RUNTIME: dev

# Bu workflow repo KÖKÜNDE yaşar (GitHub Actions yalnızca kökteki
# .github/workflows/ dizinini okur), ama projenin tamamı `zero-spring/` altında.
# Bu default TÜM `run:` adımlarının PWD'sini zero-spring yapar.
#
# DİKKAT — kapsamı sınırlıdır, iki istisnayı karıştırmayın:
#  • `uses:` action girdileri (`with: path:`, `cache-dependency-path:` …) bu
#    default'tan ETKİLENMEZ; GITHUB_WORKSPACE'e göredir → `zero-spring/` öneki şart.
#  • Adım seviyesindeki `working-directory:` de GITHUB_WORKSPACE'e göredir, bu
#    default'a göre DEĞİL → orada da tam yol (`zero-spring/backend`) yazılır.
# `run:` scriptlerinin İÇİNDEKİ göreli yollar ise PWD=zero-spring olduğu için
# önek ALMAZ. Bir dosyayı `run:` üretip `uses:` ile yüklüyorsanız (dist/, *.log,
# *.sarif) ikisi birlikte hareket etmelidir: üretim `dist`, yükleme `zero-spring/dist`.
defaults:
  run:
    working-directory: zero-spring

jobs:
  # ── GATE 1: build ────────────────────────────────────────────────────────────
  # NEDEN zorunlu: derlenmeyen bir kod tabanında test/kontrat/smoke sonuçlarının
  # hiçbir anlamı yok. En ucuz ve en hızlı sinyal; zincirin başında durur ve
  # sonraki job'ların boşa Postgres/JVM ayağa kaldırmasını engeller.
  # Ayrıca üretilen jar'ı artifact olarak yayınlar; drift ve smoke gate'leri
  # backend'i yeniden derlemek yerine TAM OLARAK test edilen bu jar'ı çalıştırır.
  build:
    name: build
    runs-on: ubuntu-latest
    # Dependabot PR'ları tam zinciri tetikliyordu: 15 açık PR × 8 job, üçü Postgres kaldırıp
    # jar boot ediyor. Ölçüldü: tek bir dependabot PR'ı 9–10 dakika duvar saati yaktı.
    #
    # Neden `on.pull_request.branches-ignore: ['dependabot/**']` DEĞİL: `pull_request` için
    # `branches` filtresi **base** branch'e bakar, head'e değil. Base her zaman `main` olduğu
    # için o filtre hiçbir şey elemez ve eleme yaptığını sanırsınız — sessiz no-op.
    #
    # `build` atlanınca `needs:` zinciriyle bağlı 7 job'ın hepsi atlanır (skipped job dakika
    # harcamaz). Guard'ı buraya koymanın nedeni bu; her job'a ayrı ayrı yazmak gerekmiyor.
    #
    # ⚠️ TAKAS: dependabot PR'ları artık DOĞRULANMADAN duruyor. Merge etmeden önce Actions →
    # CI → "Run workflow" ile o branch üzerinde elle koşturun. Bu depoda branch protection
    # zaten kurulamıyor (PROD-R23), yani kırmızı bir check hiçbir şeyi engellemiyordu.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zero-spring/frontend/app/package-lock.json

      # Testler burada kasıtlı olarak atlanır; test çalıştırma GATE 2'nin işi.
      # Bu adım sadece "derleniyor mu + paketlenebiliyor mu" sorusunu yanıtlar.
      #
      # E3: `clean`, GATE 2a ile AYNI gerekçeyle burada da var (oradaki uzun nota
      # bakın). Bu adımın ürettiği jar'ı typed-client-drift ve live-smoke
      # yeniden derlemeden çalıştırıyor — yani buradaki bir stale .class, üç
      # gate'i birden bu turun kodunu hiç görmemiş bir artifact üzerinde yeşile
      # boyar. Temiz checkout'ta target/ zaten yok; maliyet sıfır, garanti mutlak.
      - name: Backend package (skip tests)
        working-directory: zero-spring/backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests clean package

      - name: Frontend install + build
        working-directory: zero-spring/frontend/app
        run: |
          npm ci
          npm run build

      # Sonraki gate'ler bu jar'ı indirip çalıştırır (yeniden derleme yok →
      # test edilen artifact ile smoke edilen artifact birebir aynı).
      - name: Upload backend jar
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          # R-01b: sabit ad (pom.xml <finalName>app</finalName>). Eskiden burada
          # `zero-platform-*.jar` globu vardı ve jar adı artifactId'den türüyordu —
          # şablonu klonlayıp artifactId'yi değiştiren biri bu satırı da değiştirmek
          # zorundaydı, unutursa `if-no-files-found: error` sayesinde BURASI patlardı
          # ama aşağıdaki `ls` tüketicileri sessizce boş JAR ile devam ederdi.
          path: zero-spring/backend/target/app.jar
          if-no-files-found: error
          retention-days: 7

  # ── GATE 2a: backend test ────────────────────────────────────────────────────
  # NEDEN zorunlu: `verify` surefire (unit) + failsafe (Testcontainers IT) +
  # jacoco check zincirini koşturur. Multi-tenant izolasyon, permission ve
  # subscription invariant'larının regresyona uğramadığını kanıtlayan tek yer.
  #
  # E3 — `clean` NEDEN ZORUNLU (false-green riski):
  # Maven'in incremental compiler'ı "kaynak dosya .class'tan YENİ mi" diye bakar.
  # Bu karşılaştırma mtime tabanlı, içerik tabanlı DEĞİL. Bir kaynak dosyanın
  # LastWriteTime'ı GERİYE giderse — `Copy-Item`, `git stash pop`, bazı `checkout`
  # ve rsync/artifact restore yolları bunu rutin olarak yapar — recompile ATLANIR
  # ve `verify` bir önceki turun BYTECODE'unu test eder.
  # Sonuç iki türlü de yanlıştır: kaldırılmış bir bug yüzünden yanlış KIRMIZI, ya
  # da çok daha kötüsü, hiç derlenmemiş bir düzeltme için yanlış YEŞİL — yani bu
  # gate'in tek işlevi olan "kod gerçekten test edildi" garantisi çöker.
  # `clean` bunu tek hamlede imkânsız kılar: target/ yokken atlanacak bir .class
  # da yoktur. Runner'lar zaten temiz checkout ile başladığı için ek maliyet
  # pratikte sıfır; ~/.m2 cache'i `setup-java` tarafından korunduğundan bağımlılık
  # indirmesi tekrarlanmaz.
  backend:
    name: backend
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify (unit + integration, Testcontainers)
        working-directory: zero-spring/backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            zero-spring/backend/target/surefire-reports/
            zero-spring/backend/target/failsafe-reports/
            zero-spring/backend/target/site/jacoco/
          if-no-files-found: ignore

  # ── GATE 2b: frontend test ───────────────────────────────────────────────────
  # NEDEN zorunlu: `npm run build` = `tsc -b && vite build`, yani tip hatası
  # build'i düşürür. Vitest ise davranış regresyonlarını yakalar. İkisi de
  # backend'den bağımsız koştuğu için backend job'ı ile paralel çalışır.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: zero-spring/frontend/app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zero-spring/frontend/app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Unit / behaviour tests (Vitest)
        run: npm run test

      - name: Upload Vitest reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-reports
          path: |
            zero-spring/frontend/app/coverage/
            zero-spring/frontend/app/test-results/
          if-no-files-found: ignore

  # ── GATE 3: typed-client-drift ───────────────────────────────────────────────
  # NEDEN zorunlu: `src/api/schema.d.ts` repoda elle commit'lenen bir TÜRETİLMİŞ
  # dosya. Backend'de bir DTO/endpoint değişip schema yeniden üretilmezse frontend
  # DERLENMEYE DEVAM EDER ama yanlış tiplere göre derlenir — hata ancak runtime'da,
  # üretimde ortaya çıkar. Bu gate backend'i gerçekten ayağa kaldırıp /v3/api-docs
  # üzerinden schema'yı yeniden üretir ve repodakiyle byte-byte karşılaştırır.
  typed-client-drift:
    name: typed-client-drift
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zero
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zero-spring/frontend/app/package-lock.json

      - name: Download backend jar
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: zero-spring/dist

      # Redis servisi GEREKMEZ: dev profilinde de spring.cache.type=simple (base'den miras)
      # ve ImpersonationTokenStore in-memory. Lettuce bağlantısı lazy olduğu için
      # boot sırasında Redis'e hiç dokunulmaz.
      #
      # DİKKAT (PROD-R29): bu, "boot" için doğru; `/actuator/health` için DEĞİL. Aggregate
      # health endpoint'i redis indicator'ını AKTİF OLARAK yoklar, bağlantı reddedilir ve
      # uç 503 döner — uygulama her isteği normal cevaplarken. Bu yüzden hazır-olma kontrolü
      # `/actuator/health/readiness`e bakar (readinessState + db); aşağıya bakın.
      - name: Start backend
        run: |
          set -euo pipefail
          # R-01b: glob + `ls` DEĞİL, sabit ad + açık varlık kontrolü. Eski hâlde jar adı
          # artifactId'den türüyordu; artifactId değişince `ls` hiçbir şey bulamaz, `JAR`
          # boş kalır ve hata `java -jar` satırına kadar taşınıp anlamsız bir mesaja dönerdi.
          JAR=dist/app.jar
          test -f "${JAR}" || { echo "::error::${JAR} yok — build gate'inin artifact'i inmemiş"; exit 1; }
          echo "Booting ${JAR}"
          JWT_SECRET="$(head -c 64 /dev/urandom | base64 -w0)" \
          SPRING_PROFILES_ACTIVE="${SPRING_PROFILES_ACTIVE_RUNTIME}" \
          DB_URL="${DB_URL}" DB_USER="${DB_USER}" DB_PASSWORD="${DB_PASSWORD}" \
          SEED_ADMIN_PASSWORD="${SEED_ADMIN_PASSWORD}" \
          nohup java -jar "${JAR}" > backend.log 2>&1 &
          echo $! > backend.pid

      # Adımın adı hep "readiness"ti ama aggregate `/actuator/health`'ı yokluyordu — yani
      # kendi adıyla çelişiyordu. Aggregate, trafiği servis etmek için gerekmeyen her
      # bağımlılığı da içerir (burada: redis servisi yok → 503 → 60 sn timeout → gate düşer).
      # `readiness` tam olarak "istek servis edebilir miyim" sorusudur ve Dockerfile
      # HEALTHCHECK'i ile k8s probe'unun kullandığı uçtur; CI'ın da onu kullanması gerekir.
      - name: Wait for readiness
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null; then
              echo "Backend is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Backend did not become ready within 60s"
          tail -n 200 backend.log
          exit 1

      - name: Install frontend deps (pinned openapi-typescript)
        working-directory: zero-spring/frontend/app
        run: npm ci

      # `npm run gen:api` ile BİREBİR aynı çağrı — generator sürümü de
      # package-lock'tan geldiği için üretim koşulları yerelle özdeş.
      - name: Regenerate typed client from live /v3/api-docs
        working-directory: zero-spring/frontend/app
        run: |
          set -euo pipefail
          curl -sf http://localhost:8080/v3/api-docs -o "${RUNNER_TEMP}/api-docs.json"
          npx --no-install openapi-typescript http://localhost:8080/v3/api-docs \
            -o "${RUNNER_TEMP}/schema.generated.d.ts"

      - name: Fail on schema drift
        working-directory: zero-spring/frontend/app
        run: |
          set -euo pipefail
          if ! diff -u src/api/schema.d.ts "${RUNNER_TEMP}/schema.generated.d.ts"; then
            echo "::error::Typed client drift: src/api/schema.d.ts, çalışan backend'in OpenAPI şemasıyla uyuşmuyor. Backend'i lokal çalıştırıp 'npm run gen:api' ile yeniden üretin ve commit'leyin."
            exit 1
          fi
          echo "Typed client is in sync."

      - name: Upload OpenAPI snapshot
        if: always()
        run: cp "${RUNNER_TEMP}/api-docs.json" ./api-docs.json || true

      - name: Upload drift diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-snapshot
          path: |
            zero-spring/api-docs.json
            zero-spring/backend.log
          if-no-files-found: ignore

  # ── GATE 4: migration-drift ──────────────────────────────────────────────────
  # NEDEN zorunlu (PROD-R12): buradaki HER doğrulama bugüne kadar TEMİZ bir veritabanı
  # üzerinde yapılıyordu. MigrationGuardIT, live-smoke, Testcontainers — hepsi boş bir
  # şemaya V1..Vn uygular. Prod'da olan şey bu değildir: prod'da MEVCUT bir kurulum
  # vardır ve yalnızca yeni sürümler uygulanır. F5-R9 tam olarak bu boşluktan geçti —
  # temiz DB'de tüm suite yeşilken çalışan kurulum bozuktu.
  #
  # Bu gate önceki sürümün migration setini uygular (= "mevcut kurulum"), sonra bu
  # commit'in setini ONUN ÜSTÜNE koyar ve üç ayrı şeyi assert eder:
  #   1. checksum drift — uygulanmış bir V dosyası sonradan düzenlendiyse `validate` düşer.
  #      Bu, prod'da Flyway'in başlangıçta patlamasıyla AYNI hatadır, ama deploy'dan önce.
  #   2. dolu şema üzerine migrate — yeni sürüm var olan veriye/kısıtlara karşı uygulanır.
  #   3. entity ↔ şema uyumu — jar `ddl-auto=validate` ile YÜKSELTİLMİŞ şemaya karşı boot eder.
  #      Yeni bir kolonu migration'a eklemeyi unutmak burada yakalanır; temiz kurulumda
  #      yakalanmaz, çünkü orada da aynı eksik kolon eksiktir ve tutarlı görünür.
  # 4. idempotency — migrate iki kez koşar; ikincisi hiçbir şey uygulamamalıdır.
  migration-drift:
    name: migration-drift
    runs-on: ubuntu-latest
    needs: typed-client-drift
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zero
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        # Geçmiş gerekli: "önceki sürümün migration seti" bir önceki commit'ten/base
        # branch'ten çıkarılıyor. fetch-depth: 1 ile bu gate hiçbir şey karşılaştıramaz.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download backend jar
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: zero-spring/dist

      - name: Resolve the previous migration set
        id: baseset
        run: |
          set -euo pipefail
          MIGDIR=backend/src/main/resources/db/migration
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
          else
            BASE="HEAD^"
          fi

          if ! git rev-parse --verify "${BASE}" >/dev/null 2>&1; then
            echo "::warning::Karşılaştırılacak önceki commit yok (${BASE}); gate temiz kurulumla sınırlı koşacak"
            echo "have_base=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p oldset
          if git archive "${BASE}" "${MIGDIR}" 2>/dev/null | tar -x -C oldset --strip-components=6; then
            echo "have_base=true" >> "$GITHUB_OUTPUT"
            echo "Önceki set (${BASE}):"
            ls -1 oldset
          else
            echo "::warning::${BASE} içinde ${MIGDIR} yok; gate temiz kurulumla sınırlı koşacak"
            echo "have_base=false" >> "$GITHUB_OUTPUT"
          fi

      # Flyway CLI, uygulamanın kendisi değil: eski seti uygularken yeni jar'ın entity
      # doğrulaması araya girmemeli — yoksa "eski şema + yeni entity" adımı, ölçmek
      # istediğimiz şeyin ta kendisi olduğu halde, kurulumu hiç kuramadan patlar.
      - name: Apply the PREVIOUS migration set (simulated existing installation)
        if: steps.baseset.outputs.have_base == 'true'
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "${PWD}/oldset:/flyway/sql:ro" \
            flyway/flyway:11-alpine \
            -url="${DB_URL}" -user="${DB_MIGRATION_USER}" -password="${DB_MIGRATION_PASSWORD}" \
            -connectRetries=10 -baselineOnMigrate=false \
            migrate

      # Asıl kapı. `validate` uygulanmış her migration'ın checksum'ını dosyalarla
      # karşılaştırır: yayınlanmış bir V dosyası düzenlendiyse burada düşer.
      - name: Validate the CURRENT set against it (checksum drift)
        if: steps.baseset.outputs.have_base == 'true'
        run: |
          set -euo pipefail
          if ! docker run --rm --network host \
            -v "${PWD}/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11-alpine \
            -url="${DB_URL}" -user="${DB_MIGRATION_USER}" -password="${DB_MIGRATION_PASSWORD}" \
            -connectRetries=10 -ignoreMigrationPatterns='*:pending' \
            validate; then
            echo "::error::migration-drift: checksum drift — yayınlanmış bir migration dosyası değiştirilmiş. Mevcut kurulumlarda Flyway başlangıçta patlar. Düzeltme: dosyayı geri al ve değişikliği YENİ bir V sürümü olarak ekle."
            exit 1
          fi

      - name: Migrate onto the populated schema, then prove it is idempotent
        run: |
          set -euo pipefail
          run_flyway() {
            docker run --rm --network host \
              -v "${PWD}/backend/src/main/resources/db/migration:/flyway/sql:ro" \
              flyway/flyway:11-alpine \
              -url="${DB_URL}" -user="${DB_MIGRATION_USER}" -password="${DB_MIGRATION_PASSWORD}" \
              -connectRetries=10 "$@"
          }
          run_flyway migrate
          run_flyway migrate | tee second.log
          if ! grep -q "already up to date\|No migration necessary\|Schema .* is up to date" second.log; then
            echo "::error::migration-drift: ikinci migrate no-op değil — bir migration tekrar uygulanıyor"
            exit 1
          fi
          run_flyway info

      # F5-R9 sınıfı: entity haritası YÜKSELTİLMİŞ şemaya uyuyor mu. ddl-auto=validate
      # olduğu için uyumsuzluk boot'u düşürür; migration'sız eklenen bir alan burada çıkar.
      - name: Boot the jar against the upgraded schema (ddl-auto=validate)
        run: |
          set -euo pipefail
          # R-01b: sabit ad (pom.xml <finalName>app</finalName>) — bkz. GATE 3'teki uzun not.
          JAR=dist/app.jar
          test -f "${JAR}" || { echo "::error::${JAR} yok — build gate'inin artifact'i inmemiş"; exit 1; }
          JWT_SECRET="$(head -c 64 /dev/urandom | base64 -w0)" \
          SPRING_PROFILES_ACTIVE="${SPRING_PROFILES_ACTIVE_RUNTIME}" \
          DB_URL="${DB_URL}" DB_USER="${DB_USER}" DB_PASSWORD="${DB_PASSWORD}" \
          SEED_ADMIN_PASSWORD="${SEED_ADMIN_PASSWORD}" \
          nohup java -jar "${JAR}" > migration-boot.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null 2>&1; then
              echo "Yükseltilmiş şema üzerinde boot OK"
              exit 0
            fi
            sleep 2
          done
          echo "::error::migration-drift: jar yükseltilmiş şemaya karşı boot edemedi (ddl-auto=validate uyumsuzluğu olabilir)"
          tail -n 120 migration-boot.log
          exit 1

      - name: Upload migration logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-drift-logs
          path: |
            zero-spring/migration-boot.log
            zero-spring/second.log
          if-no-files-found: ignore

  # ── GATE 5: live-smoke ───────────────────────────────────────────────────────
  # NEDEN zorunlu: Testcontainers IT'leri Spring context'i kendi kurar; gerçek
  # `java -jar` başlangıcını (Flyway migration zinciri, seed runner, filter sırası,
  # security chain) doğrulamaz. Bu gate paketlenmiş jar'ı üretimdeki gibi çalıştırıp
  # kritik akışları HTTP üzerinden assert eder — özellikle NEGATİF tenant izolasyon
  # vakalarını, çünkü bir izolasyon açığı 200 döner ve pozitif testlerden kaçar.
  live-smoke:
    name: live-smoke
    runs-on: ubuntu-latest
    needs: migration-drift
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zero
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # PROD-R16: access-token revocation is FAIL-CLOSED — if Redis is unreachable the resource
      # server rejects every authenticated request (a revoked token must never be honoured). So the
      # booted jar now REQUIRES Redis to serve the authenticated smoke calls below; without it the
      # login smoke would pass but every /me / negative-tenant assertion would 401. dev profile
      # defaults Redis to localhost:6380, so the service is mapped there.
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download backend jar
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: zero-spring/dist

      - name: Start backend
        run: |
          set -euo pipefail
          # R-01b: glob + `ls` DEĞİL, sabit ad + açık varlık kontrolü. Eski hâlde jar adı
          # artifactId'den türüyordu; artifactId değişince `ls` hiçbir şey bulamaz, `JAR`
          # boş kalır ve hata `java -jar` satırına kadar taşınıp anlamsız bir mesaja dönerdi.
          JAR=dist/app.jar
          test -f "${JAR}" || { echo "::error::${JAR} yok — build gate'inin artifact'i inmemiş"; exit 1; }
          echo "Booting ${JAR}"
          JWT_SECRET="$(head -c 64 /dev/urandom | base64 -w0)" \
          SPRING_PROFILES_ACTIVE="${SPRING_PROFILES_ACTIVE_RUNTIME}" \
          DB_URL="${DB_URL}" DB_USER="${DB_USER}" DB_PASSWORD="${DB_PASSWORD}" \
          SEED_ADMIN_PASSWORD="${SEED_ADMIN_PASSWORD}" \
          nohup java -jar "${JAR}" > backend.log 2>&1 &
          echo $! > backend.pid

      # PROD-R29: aggregate `/actuator/health` DEĞİL. Bu job artık redis servisi taşıyor (PROD-R16
      # revocation için), yani aggregate bugün UP dönerdi — ama trafik/hazır-olma kapısı bilinçle
      # yine `readiness` (= readinessState + db); redis/mail readiness'e dâhil değil.
      - name: Wait for readiness
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null; then
              echo "Backend is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Backend did not become ready within 60s"
          tail -n 200 backend.log
          exit 1

      - name: Critical flow smoke (HTTP assertions)
        run: |
          set -euo pipefail
          API=http://localhost:8080
          FAILURES=0

          # Beklenen HTTP kodunu assert eder; sapmada gövdeyi basar ama koşuya
          # devam eder, böylece tek raporda TÜM kırıkları görürüz.
          assert_code() {
            local label="$1" expected="$2" actual="$3" body="$4"
            if [ "${actual}" = "${expected}" ]; then
              echo "PASS  ${label} (${actual})"
            else
              echo "::error::FAIL ${label}: beklenen ${expected}, gelen ${actual}"
              echo "----- response body -----"
              cat "${body}" 2>/dev/null || true
              echo
              FAILURES=$((FAILURES + 1))
            fi
          }

          # 1) HOST admin login — seed'in çalıştığını ve JWT üretimini kanıtlar.
          CODE=$(curl -s -o /tmp/host-login.json -w '%{http_code}' \
            -X POST "${API}/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"usernameOrEmail\":\"admin\",\"password\":\"${SEED_ADMIN_PASSWORD}\"}")
          assert_code "host login" 200 "${CODE}" /tmp/host-login.json
          # `|| true`: gövde JSON değilse jq hata verir ve `set -e` koşuyu
          # yarıda keser; token boş kalsın, kontrolü aşağıdaki guard yapsın.
          HOST_TOKEN=$(jq -r '.accessToken // empty' /tmp/host-login.json 2>/dev/null || true)
          if [ -z "${HOST_TOKEN}" ]; then
            echo "::error::Host access token alınamadı; kalan akışlar koşulamaz."
            tail -n 200 backend.log
            exit 1
          fi

          # 2) /api/auth/me — resource-server chain + claim çözümlemesi ayakta mı.
          CODE=$(curl -s -o /tmp/me.json -w '%{http_code}' \
            "${API}/api/auth/me" -H "Authorization: Bearer ${HOST_TOKEN}")
          assert_code "host /api/auth/me" 200 "${CODE}" /tmp/me.json
          # Host kullanıcısının tenantId'si null OLMALI; doluysa tenant sızıntısı var.
          ME_TENANT=$(jq -r '.tenantId // "null"' /tmp/me.json 2>/dev/null || echo "unparseable")
          if [ "${ME_TENANT}" != "null" ]; then
            echo "::error::FAIL host /api/auth/me: tenantId null bekleniyordu, gelen ${ME_TENANT}"
            FAILURES=$((FAILURES + 1))
          else
            echo "PASS  host tenantId is null"
          fi

          # 3) Editions list — SaaS seed + host-only permission yolu.
          CODE=$(curl -s -o /tmp/editions.json -w '%{http_code}' \
            "${API}/api/editions" -H "Authorization: Bearer ${HOST_TOKEN}")
          assert_code "host GET /api/editions" 200 "${CODE}" /tmp/editions.json

          # 4) Subscriptions list — default tenant'ın subscription'ı provision edilmiş mi.
          CODE=$(curl -s -o /tmp/subs.json -w '%{http_code}' \
            "${API}/api/subscriptions" -H "Authorization: Bearer ${HOST_TOKEN}")
          assert_code "host GET /api/subscriptions" 200 "${CODE}" /tmp/subs.json

          # 5) NEGATİF — host token'ı + X-Tenant header'ı = tenant mismatch.
          #    AuthenticatedTenantFilter, JWT claim'i ile header'ı karşılaştırır;
          #    header ile yetki genişletme (privilege widening) burada 403 olmalı.
          CODE=$(curl -s -o /tmp/mismatch.json -w '%{http_code}' \
            "${API}/api/auth/me" \
            -H "Authorization: Bearer ${HOST_TOKEN}" -H 'X-Tenant: default')
          assert_code "NEGATIVE host token + X-Tenant (tenant mismatch)" 403 "${CODE}" /tmp/mismatch.json

          # 6) TENANT admin login (X-Tenant: default).
          CODE=$(curl -s -o /tmp/tenant-login.json -w '%{http_code}' \
            -X POST "${API}/api/auth/login" \
            -H 'Content-Type: application/json' -H 'X-Tenant: default' \
            -d "{\"usernameOrEmail\":\"admin\",\"password\":\"${SEED_ADMIN_PASSWORD}\"}")
          assert_code "tenant login" 200 "${CODE}" /tmp/tenant-login.json
          TENANT_TOKEN=$(jq -r '.accessToken // empty' /tmp/tenant-login.json 2>/dev/null || true)

          # 7) NEGATİF — tenant admin host-only SaaS kaynağına erişemez.
          #    DataSeeder tenant Admin rolünden hostOnlyPermissionNames()'i çıkarır;
          #    bu 200 dönerse host/tenant permission ayrımı kırılmış demektir.
          if [ -n "${TENANT_TOKEN}" ]; then
            CODE=$(curl -s -o /tmp/tenant-subs.json -w '%{http_code}' \
              "${API}/api/subscriptions" \
              -H "Authorization: Bearer ${TENANT_TOKEN}" -H 'X-Tenant: default')
            assert_code "NEGATIVE tenant admin GET /api/subscriptions" 403 "${CODE}" /tmp/tenant-subs.json

            CODE=$(curl -s -o /tmp/tenant-editions.json -w '%{http_code}' \
              "${API}/api/editions" \
              -H "Authorization: Bearer ${TENANT_TOKEN}" -H 'X-Tenant: default')
            assert_code "NEGATIVE tenant admin GET /api/editions" 403 "${CODE}" /tmp/tenant-editions.json
          else
            echo "::error::Tenant access token alınamadı; negatif tenant testleri koşulamadı."
            FAILURES=$((FAILURES + 1))
          fi

          # 8) NEGATİF — token'sız korumalı endpoint 401 olmalı.
          CODE=$(curl -s -o /tmp/anon.json -w '%{http_code}' "${API}/api/auth/me")
          assert_code "NEGATIVE anonymous /api/auth/me" 401 "${CODE}" /tmp/anon.json

          # 9) NEGATİF — bilinmeyen tenant header'ı 400 TENANT_UNKNOWN olmalı.
          CODE=$(curl -s -o /tmp/unknown-tenant.json -w '%{http_code}' \
            -X POST "${API}/api/auth/login" \
            -H 'Content-Type: application/json' -H 'X-Tenant: no-such-tenant' \
            -d '{"usernameOrEmail":"admin","password":"whatever"}')
          assert_code "NEGATIVE unknown tenant header" 400 "${CODE}" /tmp/unknown-tenant.json

          echo "──────────────────────────────"
          if [ "${FAILURES}" -ne 0 ]; then
            echo "::error::live-smoke: ${FAILURES} assertion başarısız"
            tail -n 200 backend.log
            exit 1
          fi
          echo "live-smoke: tüm assertion'lar geçti"

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-smoke-backend-log
          path: zero-spring/backend.log
          if-no-files-found: ignore

  # ── GATE 6: security-checks ──────────────────────────────────────────────────
  # NEDEN zorunlu: sızmış bir credential geri alınamaz — rotasyon gerektirir; bu
  # yüzden merge ÖNCESİ bloklamak tek etkili nokta.
  #
  # PRAGMATİK YAKLAŞIM (bilinçli tercih):
  #  • Bloklayıcı olan: dar kapsamlı, sıfıra yakın false-positive üreten desen
  #    taraması (private key blokları, AWS anahtarları, prod config'te literal
  #    secret). Bunlar yakalandığında istisnasız gerçek bulgudur.
  #  • Bloklayıcı OLMAYAN: gitleaks tam-geçmiş taraması. Repo, kasıtlı olarak
  #    commit'lenmiş dev-only placeholder'lar içeriyor (application.yml'deki dev
  #    JWT secret'ı, 'Admin123!' seed varsayılanı). Bunlar gitleaks'in generic
  #    kurallarını tetikler; .gitleaksignore olmadan gate kalıcı kırmızı olur ve
  #    ekip onu görmezden gelmeye başlar — yani gate işlevini yitirir. Rapor
  #    artifact olarak yayınlanır; .gitleaksignore eklendikten sonra
  #    continue-on-error kaldırılıp bloklayıcı hale getirilmelidir.
  #  • Backend için ağır OWASP Dependency-Check KASITLI olarak yok: NVD feed'i
  #    her koşuda ~10+ dk sürer, API anahtarı ister ve transitive Spring Boot
  #    CVE'lerinde yüksek gürültü üretir. PR yolunda değil, ayrı bir zamanlanmış
  #    (schedule) workflow'a ait. Sürüm yükseltmeleri Dependabot'a bırakılmalı.
  security-checks:
    name: security-checks
    runs-on: ubuntu-latest
    needs: live-smoke
    steps:
      - name: Checkout (full history for secret scanning)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zero-spring/frontend/app/package-lock.json

      # BLOKLAYICI: yalnızca tartışmasız gerçek bulgular.
      - name: Secret pattern scan (blocking)
        run: |
          set -uo pipefail
          FAILURES=0

          scan() {
            local label="$1" pattern="$2"
            # .git ve lock dosyaları hariç; -I binary'leri atlar.
            # `.` = zero-spring (defaults.run.working-directory). Kök `.github` AYRICA taranmalı:
            # workflow dosyaları credential gömmenin klasik yeridir ve ci.yml artık repo kökünde
            # yaşıyor, yani `.` kapsamının dışında. `Asp.NET Zero/` bilinçli olarak dışarıda
            # (untracked vendor referansı; kök .gitignore'da).
            if grep -rInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target \
                 --exclude='*.lock' --exclude='package-lock.json' \
                 -- "${pattern}" . "${GITHUB_WORKSPACE}/.github" ; then
              echo "::error::Secret scan hit: ${label}"
              FAILURES=$((FAILURES + 1))
            else
              echo "PASS  ${label}"
            fi
          }

          scan "private key block"      '-----BEGIN (RSA|EC|DSA|OPENSSH|PGP)? ?PRIVATE KEY-----'
          scan "AWS access key id"      'A(KIA|SIA|ROA)[0-9A-Z]{16}'
          scan "Slack token"            'xox[baprs]-[0-9A-Za-z-]{10,}'
          scan "GitHub PAT"             'gh[pousr]_[0-9A-Za-z]{36}'
          scan "Google API key"         'AIza[0-9A-Za-z_-]{35}'

          # prod config'te her secret env referansı OLMALI (${...}).
          # Literal bir değer buraya girerse imaja gömülür ve rotasyon imkânsızlaşır.
          PROD_YML=backend/src/main/resources/application-prod.yml
          if [ -f "${PROD_YML}" ]; then
            if grep -InE '^[[:space:]]*(secret|password|host-admin-password|token|api-key):[[:space:]]*[^$[:space:]]' "${PROD_YML}"; then
              echo "::error::${PROD_YML} içinde literal secret var; \${ENV_VAR} referansı kullanın."
              FAILURES=$((FAILURES + 1))
            else
              echo "PASS  application-prod.yml secrets are env-referenced"
            fi
          else
            # `else` dalı olmadan bu kontrol, dosya taşındığında/yeniden adlandırıldığında
            # SESSİZCE atlanır ve job yeşil kalır — bu turun konusu olan sınıfın ta kendisi.
            echo "::error::${PROD_YML} bulunamadı; prod secret kontrolü koşamadı (yol değişmiş olabilir)"
            FAILURES=$((FAILURES + 1))
          fi

          if [ "${FAILURES}" -ne 0 ]; then
            echo "::error::security-checks: ${FAILURES} bloklayıcı secret bulgusu"
            exit 1
          fi
          echo "Secret pattern scan clean."

      # ARTIK BLOKLAYICI. Advisory bırakmanın gerekçesi "gürültü üretebilir"di; ölçüldü:
      # düzeltildikten sonraki ilk gerçek taraması 20 commit gezip 3 bulgu verdi, üçü de
      # TEST-ONLY JWT anahtarıydı ve `.gitleaks.toml` ile (tam base64 değerleriyle, yol bazlı
      # DEĞİL) susturuldu → şu an geçmiş temiz, "no leaks found". Temiz ve çalışan bir taramayı
      # advisory bırakmak, gelecekteki GERÇEK bir sızıntının da yok sayılması demekti — PROD-R24'ün
      # üç katmanlı fail-open'ının aynısı, bu kez bilerek yapılmış hâli.
      #
      # `--config` AÇIKÇA veriliyor: otomatik keşfe güvenilmiyor. Ayrıca gitleaks v8.18.4 yanlış
      # config sözdizimini SESSİZCE yok sayar (hata vermez, config yokmuş gibi davranır), bu
      # yüzden config'in etkili olduğu bulgu sayısıyla ölçülerek doğrulandı (3 → 0).
      #
      # `${GITHUB_WORKSPACE}` mount ediliyor, `${PWD}` DEĞİL. Bu adım `defaults.run.working-directory`
      # yüzünden `zero-spring/` içinde koşuyor ve orada `.git` yok — `.git` workspace kökünde.
      # `detect` (yani `--no-git` olmayan mod) git geçmişini tarar, dolayısıyla `.git` içermeyen bir
      # dizin mount edilirse gitleaks repo açamaz ve HER koşuda hata verir. Üstelik bu hata üç ayrı
      # yerde yutuluyordu: `continue-on-error: true`, SARIF hiç üretilmediği için
      # `if-no-files-found: ignore`, ve adımın advisory olması. Sonuç: `fetch-depth: 0`'ın maliyeti
      # ödenip faydası hiç alınmadan **yeşil** görünen bir secret taraması. Rapor yolu da mount ile
      # birlikte hareket etmek zorunda, yoksa upload adımı boşa bakar.
      - name: gitleaks full-history scan (blocking)
        id: gitleaks
        run: |
          set -uo pipefail
          if ! docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo \
            zricethezav/gitleaks:v8.18.4 detect \
            --source=/repo --config=/repo/.gitleaks.toml --redact --exit-code=1 \
            --report-format=sarif --report-path=/repo/zero-spring/gitleaks.sarif; then
            echo "::error::gitleaks: geçmişte sızmış secret bulundu. Rapor artifact'ta (gitleaks-report). Gerçekten secret ise ROTASYON şart — dosyadan silmek yeterli değil, değer git geçmişinde kalır."
            exit 1
          fi

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: zero-spring/gitleaks.sarif
          if-no-files-found: ignore

      # BLOKLAYICI: frontend bağımlılıkları doğrudan tarayıcıya gider; high/critical
      # bir zafiyet son kullanıcıya ulaşır. Eşik bilinçli olarak `high` — `moderate`
      # dev-only transitive paketlerde sürekli gürültü üretir.
      - name: npm audit (frontend, high+)
        working-directory: zero-spring/frontend/app
        run: npm audit --audit-level=high

  # ── RELEASE ──────────────────────────────────────────────────────────────────
  # Yalnızca main'e push'ta VE yukarıdaki tüm gate'ler yeşilse çalışır.
  # `needs: security-checks` zincirin son halkası olduğu için tüm önceki
  # gate'ler transitif olarak zorunludur (biri düşerse buraya hiç gelinmez).
  # ŞU AN GERÇEK DEPLOY YOK — sadece artifact'i toplayıp hazır olduğunu raporlar.
  # PROD-R27 gate: the container image was never built or inspected by any check, so its
  # hardening (non-root user, prod profile, heap ceiling, healthcheck) was unverified and could
  # rot silently. This job BUILDS the backend image and ASSERTS those four properties. It does
  # NOT push — a registry/deploy target belongs to the cloner (see the release job's scaffold).
  # `needs: build` so it runs in parallel with the test chain; `release` waits on it.
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: build
    # `packages: write` yalnız GHCR'a GITHUB_TOKEN ile push için gerekir ve YALNIZ PUSH_IMAGE=true
    # iken kullanılır. Push kapalıyken (varsayılan) hiçbir yazma yetkisi kullanılmaz.
    permissions:
      contents: read
      packages: write
    # Push parametreleri — hepsi Actions Variables/Secrets'tan. Varsayılan GÜVENLİ: PUSH_IMAGE boş →
    # imaj build edilir + sertleştirmesi doğrulanır ama REGISTRY'E PUSH EDİLMEZ.
    env:
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'zero-backend' }}
      PUSH_IMAGE: ${{ vars.PUSH_IMAGE || 'false' }}
      IMAGE_EXTRA_TAG: ${{ vars.IMAGE_EXTRA_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # NOTE (CLAUDE.md trap): action `with:` inputs resolve to the WORKSPACE ROOT, so context/file
      # are repo-root-relative here — NOT under defaults.run.working-directory (zero-spring).
      #
      # `load: true` (push DEĞİL): imaj yerel docker'a yüklenir ki sertleştirme assert'i inspect
      # edebilsin. Push, assert GEÇTİKTEN sonra ayrı, GATE'li bir adımda yapılır — böylece
      # doğrulanmamış bir imaj asla push edilmez.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: zero-spring/backend
          file: zero-spring/backend/Dockerfile
          push: false
          load: true
          tags: zero-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert image hardening (PROD-R27)
        run: |
          set -euo pipefail
          IMG=zero-backend:ci-${{ github.sha }}
          fail=0
          user=$(docker image inspect -f '{{.Config.User}}' "$IMG")
          [ "$user" = "zero" ] || { echo "::error::image runs as '$user', beklenen non-root 'zero'"; fail=1; }
          docker image inspect -f '{{if .Config.Healthcheck}}yes{{else}}no{{end}}' "$IMG" | grep -qx yes \
            || { echo "::error::image HEALTHCHECK taşımıyor"; fail=1; }
          env_lines=$(docker image inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$IMG")
          echo "$env_lines" | grep -qx 'SPRING_PROFILES_ACTIVE=prod' \
            || { echo "::error::image SPRING_PROFILES_ACTIVE=prod pinlemiyor"; fail=1; }
          echo "$env_lines" | grep -q 'MaxRAMPercentage' \
            || { echo "::error::image container-farkındalı heap tavanı (MaxRAMPercentage) set etmiyor"; fail=1; }
          [ "$fail" = 0 ] && echo "Image hardening doğrulandı: non-root · healthcheck · prod profil · heap tavanı."
          exit "$fail"

      # ── PUSH (opsiyonel, GATE'li) ── Yalnız PUSH_IMAGE=true iken. Login registry HOST'una
      # (IMAGE_REGISTRY'nin ilk path segmenti) `--password-stdin` ile yapılır; kimlik bilgisi
      # loglanmaz. GHCR: REGISTRY_TOKEN boşsa built-in GITHUB_TOKEN'a düşer (packages: write).
      - name: Registry login
        if: env.PUSH_IMAGE == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME || github.actor }}
        run: |
          set -euo pipefail
          : "${IMAGE_REGISTRY:?PUSH_IMAGE=true ama IMAGE_REGISTRY (Actions Variable) tanımlı değil}"
          : "${REGISTRY_TOKEN:?PUSH_IMAGE=true ama registry kimlik bilgisi yok (secrets.REGISTRY_TOKEN veya GITHUB_TOKEN)}"
          HOST="${IMAGE_REGISTRY%%/*}"
          echo "${REGISTRY_TOKEN}" | docker login "${HOST}" -u "${REGISTRY_USERNAME}" --password-stdin
          echo "Logged in to ${HOST} as ${REGISTRY_USERNAME}"

      - name: Push backend image
        if: env.PUSH_IMAGE == 'true'
        run: |
          set -euo pipefail
          : "${IMAGE_REGISTRY:?PUSH_IMAGE=true ama IMAGE_REGISTRY yok}"
          SHORT_SHA="${GITHUB_SHA::12}"
          REF="${IMAGE_REGISTRY}/${IMAGE_NAME}:sha-${SHORT_SHA}"
          docker tag "zero-backend:ci-${GITHUB_SHA}" "${REF}"
          docker push "${REF}"
          PUSHED="${REF}"
          # Opsiyonel rc/prod etiketi (IMAGE_EXTRA_TAG variable'ı, ör. `rc`, `prod`, `latest`).
          if [ -n "${IMAGE_EXTRA_TAG}" ]; then
            XREF="${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_EXTRA_TAG}"
            docker tag "zero-backend:ci-${GITHUB_SHA}" "${XREF}"
            docker push "${XREF}"
            PUSHED="${PUSHED}, ${XREF}"
          fi
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${REF}" 2>/dev/null || echo '(digest okunamadı)')"
          {
            echo "## Image pushed"
            echo "- tags: \`${PUSHED}\`"
            echo "- digest: \`${DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Pushed: ${PUSHED}  (digest ${DIGEST})"

      - name: Push skipped (safe default)
        if: env.PUSH_IMAGE != 'true'
        run: |
          echo "PUSH_IMAGE != 'true' → imaj build edildi + sertleştirmesi doğrulandı, ama registry'e PUSH EDİLMEDİ (varsayılan güvenli no-op)."
          echo "Push için: Actions Variables → PUSH_IMAGE=true, IMAGE_REGISTRY, IMAGE_NAME; Secrets → REGISTRY_TOKEN (GHCR'da opsiyonel)." >> "${GITHUB_STEP_SUMMARY}"

  # ŞU AN gerçek deploy KOŞMAZ (DEPLOY_ENABLED varsayılan false). Parametrik, cloud-agnostic
  # scaffold: klonlayan repo Settings'ten Variables/Secrets doldurup DEPLOY_ENABLED=true yapar.
  release:
    name: release
    runs-on: ubuntu-latest
    needs: [security-checks, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Deploy scaffold parametreleri — klonlayan repo Settings'te set eder. Varsayılan boş/false,
    # yani scaffold güvenli bir no-op: plan yazar, durur. Hiçbir cloud CLI hardcode DEĞİL (vendor
    # lock-in yok) — gerçek komut DEPLOY_COMMAND secret'i ile enjekte edilir.
    env:
      DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT || 'prod' }}
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'zero-backend' }}
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download backend jar
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: zero-spring/dist

      - name: Release artifact hazır
        run: |
          set -euo pipefail
          # R-01b: sabit ad. Bu job'da boşluk EN sinsi yerdeydi — `basename ""` ve `du -h ""`
          # release özetini sessizce boş doldurabilirdi.
          JAR=dist/app.jar
          test -f "${JAR}" || { echo "::error::${JAR} yok — release artifact'i üretilmemiş"; exit 1; }
          {
            echo "## Release artifact hazır"
            echo
            echo "| Alan | Değer |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Artifact | \`$(basename "${JAR}")\` |"
            echo "| Boyut | $(du -h "${JAR}" | cut -f1) |"
            echo
            echo "Geçilen gate'ler: build → backend/frontend test → typed-client-drift → migration-drift → live-smoke → security-checks → docker-build"
            echo
            echo "> Deploy: parametrik scaffold bağlı (aşağıdaki plan adımına bakın). DEPLOY_ENABLED=false iken yalnız plan yazılır, gerçek deploy KOŞMAZ."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Release artifact hazır: ${JAR}"

      - name: Deploy plan (dry-run)
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE_REF="${IMAGE_REGISTRY:+${IMAGE_REGISTRY}/}${IMAGE_NAME}:sha-${SHORT_SHA}"
          {
            echo "## Deploy plan (dry-run) — ${DEPLOY_ENVIRONMENT}"
            echo
            echo "| Alan | Değer |"
            echo "| --- | --- |"
            echo "| Environment | \`${DEPLOY_ENVIRONMENT}\` |"
            echo "| Image ref | \`${IMAGE_REF}\` |"
            echo "| Enabled | \`${DEPLOY_ENABLED}\` |"
            echo
            echo "**Klonlayan için doldurulacak noktalar** (repo Settings → Variables / Secrets):"
            echo "- \`IMAGE_REGISTRY\` (var) — ör. \`ghcr.io/acme\`; boşsa imaj push edilmez"
            echo "- \`IMAGE_NAME\` (var) — varsayılan \`zero-backend\`"
            echo "- \`DEPLOY_ENVIRONMENT\` (var) — \`dev\` / \`stage\` / \`prod\`"
            echo "- \`DEPLOY_COMMAND\` (secret) — cloud-agnostic deploy komutu, ör. \`kubectl apply -f k8s/\`, \`flyctl deploy\`, \`aws ecs update-service …\`"
            echo "- Uygulama sırları: prod profili \${VAR} bekler (DB_URL, JWT secret, …) — orchestrator/secret store'dan gelir, repoya YAZILMAZ"
            echo "- \`DEPLOY_ENABLED\` (var) — \`true\` yapılana dek bu job yalnız plan yazar, deploy ETMEZ"
            echo
            echo "> docker-build gate imajı üretti ve sertleştirmesini doğruladı ama **push ETMEDİ**."
            echo "> Deploy için: registry login + push adımı ekle (veya IMAGE_REGISTRY set edip docker-build'e push adımı) ve DEPLOY_COMMAND'i bağla."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Deploy plan yazıldı (dry-run). DEPLOY_ENABLED=${DEPLOY_ENABLED}"

      - name: Deploy (guarded — no-op until wired)
        env:
          DEPLOY_COMMAND: ${{ secrets.DEPLOY_COMMAND }}
        run: |
          set -euo pipefail
          if [ "${DEPLOY_ENABLED}" != "true" ]; then
            echo "DEPLOY_ENABLED != true → scaffold no-op. Klonlayan Settings'ten açar. Deploy KOŞMADI."
            exit 0
          fi
          # Fail-fast: DEPLOY_ENABLED=true iken eksik girdi = anlaşılır hata, sessiz yanlış deploy DEĞİL.
          : "${IMAGE_REGISTRY:?DEPLOY_ENABLED=true ama IMAGE_REGISTRY (Actions Variable) yok — deploy edilecek imajın nereden çekileceği belirsiz. docker-build'de PUSH_IMAGE=true ile imajı push ettiğinizden emin olun}"
          : "${DEPLOY_COMMAND:?DEPLOY_ENABLED=true ama DEPLOY_COMMAND secret'i tanımlı değil — deploy komutu yok}"
          SHORT_SHA="${GITHUB_SHA::12}"
          export IMAGE_REF="${IMAGE_REGISTRY}/${IMAGE_NAME}:sha-${SHORT_SHA}"
          echo "Deploying ${IMAGE_REF} → ${DEPLOY_ENVIRONMENT}…"
          bash -c "${DEPLOY_COMMAND}"
