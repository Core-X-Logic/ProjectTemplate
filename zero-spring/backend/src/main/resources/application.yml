spring:
  application.name: zero-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zero}
    username: ${DB_USER:zero}
    password: ${DB_PASSWORD:zero}
    # PROD-R9: an unsized pool defaults to 10 connections / 30 s timeout, which turns a slow query
    # into a cascade failure (every worker parks on connection acquisition). The timeout is kept
    # deliberately short so the request fails fast instead of holding a Tomcat thread hostage.
    hikari:
      pool-name: zero-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: 5000
      idle-timeout: 600000
      # Must stay below the database/proxy side idle cutoff, otherwise Hikari hands out a socket
      # the server already closed.
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      # Report (do not close) connections held longer than this: a leak shows up in the log as a
      # stack trace pointing at the borrower.
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:20000}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway.enabled: true
  cache:
    # dev/test default: in-memory. Prod switches to redis (application-prod.yml, F5-ARCHITECTURE §6).
    type: ${CACHE_TYPE:simple}
    # PROD-R8: must list exactly the caches CacheConfig/@Cacheable use, otherwise the simple cache
    # manager cannot resolve the name at runtime and the call 500s.
    cache-names: settings,features,subscription-validity
  mail:
    host: ${MAIL_HOST:}          # boşsa LoggingEmailSender
    port: ${MAIL_PORT:1025}
    # PROD-R19: auth was pinned to false and username/password were read from nowhere, so no real
    # relay (SES, SendGrid, Postmark — all of them require credentials) could be configured. Password
    # reset and email confirmation would have failed in production, and quietly: the sender falls back
    # to LoggingEmailSender when MAIL_HOST is blank, so the failure mode is a user who never receives
    # the mail rather than an error anyone sees. Defaults keep dev/mailpit and the GreenMail tests
    # working unchanged.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties.mail.smtp:
      auth: ${MAIL_SMTP_AUTH:false}
      starttls.enable: ${MAIL_SMTP_STARTTLS:false}
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      # PROD-R18: this was the literal 6379, so REDIS_PORT was documented as a required variable in
      # the runbook while being read by nothing. Only application-dev.yml overrode it. Managed Redis
      # rarely runs on 6379 (Azure Cache uses 6380 for TLS), and prod switches the cache to redis —
      # so the one environment that depends on the connection was the one that could not configure it.
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  servlet:
    multipart:
      # F1. Driven by the same placeholder as zero.request.max-body-bytes on purpose. Boot's defaults
      # here are 1 MB / 10 MB, so leaving them alone would have put a second, larger size ceiling on
      # the same requests — and the effective limit would then be whichever of the two an operator
      # did not know about. One knob, one answer. There are no multipart endpoints today; this is so
      # that adding one cannot silently arrive with a bound nobody chose.
      max-file-size: ${REQUEST_MAX_BODY_BYTES:1048576}
      max-request-size: ${REQUEST_MAX_BODY_BYTES:1048576}
server:
  # PROD-R4: behind a TLS-terminating proxy the request reaches Tomcat over plain HTTP, so
  # request.isSecure() is false and Spring Security silently drops the HSTS header. Honouring
  # X-Forwarded-* restores it (and gives the rate limiter the real client IP).
  # Trust boundary: only deploy behind a proxy that strips client-supplied X-Forwarded-* headers.
  forward-headers-strategy: framework
zero:
  multitenancy.header: X-Tenant
  jwt:
    # PROD-R1: no default on purpose. A committed dev secret means a profile mishap silently signs
    # tokens with a key that is public in the repository history. Dev/test values live in
    # application-dev.yml / application-test.yml; every other environment must supply JWT_SECRET.
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    issuer: zero-platform
    # PROD-R16: tokens are bound to this audience and the decoder rejects anything else, so a token
    # minted for another service that happens to share the secret cannot be replayed here.
    audience: ${JWT_AUDIENCE:zero-platform-api}
  cors:
    # PROD-R3: empty by default — a deployment must name its SPA origins explicitly. An empty list
    # means every cross-origin request is rejected, which is the safe failure mode.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    # PROD-R5: strict for a pure JSON API — it serves no HTML, so nothing may be loaded at all.
    # Relaxed in dev (application-dev.yml) so Swagger UI stays usable.
    content-security-policy: "default-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    permissions-policy: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
  ratelimit:
    # PROD-R6: IP + username throttle on the unauthenticated endpoints. Complements (does not
    # replace) the per-account lockout in AuthService.
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:10}
    refill-period: PT1M
    # D3: every permitAll endpoint that takes a @RequestBody belongs here — those are the ones an
    # anonymous caller can drive into bcrypt, the database, or the mail sender. /api/account/confirm-email
    # was missing: live, eight of eight requests from one address were served, giving unmetered
    # database load and a free channel for guessing confirmation codes. The list is checked against
    # SecurityConfig's permitAll rules by RateLimitMediaTypeFailClosedIT.everyAnonymousBodyEndpointIsThrottled,
    # so adding a permitAll POST without adding it here now fails the build.
    # /api/auth/logout is deliberately absent: it requires authentication, so it is already bounded
    # by holding a valid token, and throttling it per IP would penalise everyone behind one NAT.
    paths: /api/auth/login,/api/auth/refresh,/api/account/forgot-password,/api/account/reset-password,/api/account/confirm-email
    # D4: the largest request body accepted on any path above, in bytes. Previously this existed only
    # as a default inside RateLimitProperties, which made a load-bearing security parameter invisible
    # to whoever operates the deployment. A body over this is refused with 413 rather than forwarded
    # uninspected, because a body the limiter cannot read is one whose username bucket it cannot
    # charge (B2). These endpoints take a handful of short strings; 16 KB is already far above any
    # legitimate request, and raising it widens the window the limiter has to buffer per request.
    max-body-bytes: ${RATE_LIMIT_MAX_BODY_BYTES:16384}
  request:
    # F1: the application-wide body bound, and the reason it is a separate block from the one above.
    # zero.ratelimit.max-body-bytes (16 KB) is enforced by RateLimitFilter, and that filter runs on
    # zero.ratelimit.paths — five anonymous endpoints. Everything else in the application had NO body
    # limit at all: Tomcat imposes none on a JSON body, and @RequestBody binding happens during
    # argument resolution, i.e. BEFORE @PreAuthorize. Measured on this configuration: a principal
    # holding a valid token and zero permissions posted 1.5 MB to POST /api/users and got its 403
    # only after the whole body had been buffered and deserialized. The allocation size was the
    # caller's to choose.
    #
    # The primary control is the reverse proxy (nginx client_max_body_size — see
    # docs/RELEASE-RUNBOOK.md); this is the layer that holds when that one is missing or wrong.
    #
    # 1 MB because the largest legitimate body this API takes is a role with its permission list,
    # three orders of magnitude below it. Raising it also raises the multipart ceilings above, which
    # is the intended coupling: one size ceiling per request, not two.
    enabled: ${REQUEST_LIMIT_ENABLED:true}
    max-body-bytes: ${REQUEST_MAX_BODY_BYTES:1048576}
    # The stricter of the two rules wins where they overlap: RateLimitFilter runs first and answers
    # the anonymous paths at 16 KB, so listing /api/** here does not loosen them.
    paths: /api/**
  seed:
    # B4: OFF by default, on purpose. This used to be `true`, so a deployment that lost its
    # SPRING_PROFILES_ACTIVE fell back to a base configuration that provisions a host admin, a
    # `default` tenant and a tenant admin — against whatever database it was pointed at. Every other
    # dangerous default in this file already fails closed on a profile mishap; this one did the
    # opposite. dev and test switch it back on explicitly (application-dev.yml / application-test.yml),
    # which is where seeding is actually wanted.
    enabled: ${SEED_ENABLED:false}
    # PROD-R2: blank by default. DataSeeder refuses to seed with a blank or dev-default password on
    # ANY profile, so a missing SPRING_PROFILES_ACTIVE can no longer ship a known credential.
    host-admin-password: ${SEED_ADMIN_PASSWORD:}
    # F5-R9: permission reconciliation is NOT seeding. It has to run in prod, where seeding is off,
    # otherwise permissions added by a later release never reach the static Admin roles.
    reconcile-permissions: ${SEED_RECONCILE_PERMISSIONS:true}
  saas:
    lifecycle:
      # Trial/period/grace/downgrade taraması. ShedLock ile çok-instance'ta tek çalışır.
      interval: PT1H
      initial-delay: PT1M
      # Lock, iş bittikten sonra da kısa süre tutulur: saatleri hafif kaymış iki node'un
      # arka arkaya tetiklemesini engeller.
      lock-at-least-for: PT30S
      lock-at-most-for: PT10M
    proration:
      # Kaynak: MinimumUpgradePaymentAmount = 1M. Altındaysa ödeme istenmez, edition anında değişir.
      minimum-amount: 1.00
    subscription-gate:
      # Boş bırakılırsa SubscriptionAccessCheck.DEFAULT_EXEMPT_PATHS geçerlidir
      # (auth, account, localization, /api/subscriptions/me, actuator, swagger).
      exempt-paths: ""
springdoc:
  # PROD-R30. /v3/api-docs ciktisi JVM kosulari arasinda KARARSIZDI: springdoc, Spring'in
  # Page/Pageable arayuzlerini reflection ile geziyor ve getDeclaredMethods() sirasi JVM
  # spesifikasyonunda garanti edilmiyor. Olculdu — ayni jar, iki ayri boot:
  #   PageUserDto: totalPages/totalElements/first/last alanlari yer degistirdi.
  # typed-client-drift gate'i uretilen semayi commit'lenmis dosyayla BYTE-BYTE karsilastiriyor,
  # yani gate hicbir sey degismeden rastgele kirmiziya donerdi. Flaky bir release gate,
  # olmayan gate'ten kotudur: "yeniden koştur" refleksini ogretir, o refleks de gate'in
  # yakalamak icin var oldugu GERCEK drift'i gormezden gelmeyi ogretir.
  # Cozum kaynagi deterministik yapmak; karsilastirmayi gevsetmek degil.
  writer-with-order-by-keys: true

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
  # PROD-R29. Iki ayri sorun, ayni kok: hangi bagimliligin trafigi kesecegi hic secilmemisti.
  #
  # (a) Mail health indicator KAPALI. Actuator'un mail kontrolu her cagrida SMTP'ye gercek bir
  #     baglanti acar. Bir probe 10 saniyede bir kosarsa bu, relay'e gunde ~8600 baglanti demektir;
  #     SES/SendGrid gibi saglayicilar bunu throttle eder ya da IP'yi engeller — yani kontrolun
  #     kendisi arizayi uretir. Ustelik e-posta, istek servis etmek icin gerekli DEGIL: SMTP
  #     erisilemezken uygulama her ucu normal cevaplar. Bu ayar kapali degilken /actuator/health
  #     mailpit ayakta olmayan HER ortamda 503 donuyordu; CI'da uc test bu yuzden kirmiziya dustu
  #     (ProdApiDocsExposureIT, DefaultProfileApiDocsExposureIT, ActuatorExposureIT). Testler
  #     yanlis degildi — gelistiricinin makinesinde mailpit calistigi icin yesil goruyorlardi.
  #     Mail erisilebilirligi RELEASE-RUNBOOK §3.6 forgot-password smoke'u ile dogrulanir.
  #
  # (b) readiness grubu ACIKCA yaziliyor. Spring Boot'un varsayilani yalnizca `readinessState`tir,
  #     yani veritabani ERISILEMEZ durumdayken bile pod READY raporlar ve trafik alir — her istek
  #     500 doner. Ters yondeki hata da ayni olcude kotu: mail/redis gibi tali bagimliliklari
  #     readiness'a koymak, calisan bir uygulamayi rotasyondan cikarir. Dogru ayrim:
  #       liveness  = JVM ayakta mi
  #       readiness = istek servis edebilir miyim  -> readinessState + db
  #       /health   = tam tablo (izleme icin; tali bir bagimlilik dustugunde DOWN gorunebilir)
  #     Redis bilerek DISARIDA: PROD-R13'teki CacheErrorHandler Redis kesintisinde cache'i bypass
  #     edip WARN yaziyor, uygulama servis etmeye devam ediyor — o hâlde trafigi kesmemeli.
  health:
    mail.enabled: false
  endpoint.health.group.readiness.include: readinessState,db
