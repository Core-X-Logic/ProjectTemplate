<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${appName}">Zero Platform</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#333333;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff;border-radius:8px;overflow:hidden;max-width:600px;width:100%;">
                <tr>
                    <td style="background-color:#2d3748;padding:24px 32px;">
                        <h1 style="margin:0;color:#ffffff;font-size:20px;" th:text="${appName}">Zero Platform</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <h2 style="margin:0 0 16px;font-size:18px;color:#2d3748;">
                            Welcome, <span th:text="${name}">User</span>!
                        </h2>
                        <p style="margin:0 0 16px;line-height:1.6;">
                            Your account has been created successfully. You can now sign in with the
                            username below.
                        </p>
                        <p style="margin:0 0 16px;line-height:1.6;">
                            Username: <strong th:text="${username}">username</strong>
                        </p>
                        <p style="margin:24px 0;">
                            <a th:href="${loginUrl}" href="#"
                               style="display:inline-block;background-color:#3182ce;color:#ffffff;text-decoration:none;
                                      padding:12px 24px;border-radius:6px;font-weight:bold;">Sign in</a>
                        </p>
                        <p style="margin:0;line-height:1.6;color:#718096;font-size:13px;">
                            If you did not expect this email, you can safely ignore it.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="background-color:#f7fafc;padding:16px 32px;border-top:1px solid #edf2f7;">
                        <p style="margin:0;font-size:12px;color:#a0aec0;">
                            &copy; <span th:text="${appName}">Zero Platform</span>. This is an automated message.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
