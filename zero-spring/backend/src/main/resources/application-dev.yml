logging:
  level:
    com.mycompanyname.zero: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/zero}
  flyway:
    # RLS taban çizgisi Adım 1: dev'de de kimlikler ayrı. `docker-compose.yml` postgres'i
    # POSTGRES_USER=postgres (şifre `postgres`) ile açar ve o kümede superuser'dır — V11'in
    # CREATE ROLE yetkisi oradan gelir. Uygulama ise `zero_app` ile bağlanır (application.yml).
    #
    # ⚠️ url datasource.url İLE BİRLİKTE taşınır. Dev postgres'i host'ta 5433'te (base varsayılan
    # 5432). Yalnız datasource'u override etmek Flyway'i 5432'deki BAŞKA bir veritabanına bağlar
    # ve hata "migration'lar uygulandı ama şema boş" şeklinde çok geride çıkar.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/zero}
    user: ${DB_MIGRATION_USER:postgres}
    password: ${DB_MIGRATION_PASSWORD:postgres}
    # SIRA — temiz bir dev veritabanında `zero_app` henüz YOKTUR ve onu V11 yaratır. Bu
    # çalışır çünkü veritabanına ilk dokunan Flyway'dir: Flyway kendi bağlantısını
    # spring.flyway.* ile kurar, Hikari havuzu ise ilk `getConnection()`e kadar hiç bağlantı
    # açmaz ve o an Flyway çoktan bitmiştir. Yani ne temiz kurulumda ne de mevcut dev
    # veritabanında el ile bir adım gerekir; `docker compose up -d` + boot yeterlidir.
  data:
    redis:
      port: ${REDIS_PORT:6380}
  jpa:
    properties:
      hibernate:
        format_sql: true
zero:
  jwt:
    # PROD-R1: local-only signing key. It is committed, therefore public, therefore listed in
    # JwtSecretValidator.NON_PRODUCTION_SECRETS — booting with the 'prod' profile on this value
    # fails fast instead of signing production tokens with a key anyone can read.
    secret: ${JWT_SECRET:emVyby1wbGF0Zm9ybS1MT0NBTC1ERVYtT05MWS1zaWduaW5nLWtleS1ub3QtdmFsaWQtaW4tcHJvZHVjdGlvbi0wMTIzNDU2Nzg5YWJjZGVm}
  crypto:
    # PROD: local-only AES-256 field-encryption key (base64, 32 bytes). Committed, therefore public,
    # therefore listed in FieldEncryptionKeyValidator.NON_PRODUCTION_KEYS — booting 'prod' on this
    # value fails fast instead of encrypting real TOTP secrets with a key anyone can read.
    field-key: ${FIELD_ENCRYPTION_KEY:emVyby1GSUVMRC1FTkMtREVWLS1ub3QtaW4tcHJvZCE=}
  seed:
    # B4: the base configuration seeds nothing, so a profile mishap cannot provision anything.
    # A laptop wants the opposite, and says so explicitly.
    enabled: ${SEED_ENABLED:true}
    # Local convenience credential. Same rule: never accepted once 'prod' is active.
    host-admin-password: ${SEED_ADMIN_PASSWORD:Admin123!}
  cors:
    # Vite dev server (frontend/app).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  billing:
    iyzico:
      # P2'-B: the base default is the PRODUCTION host on purpose (see application.yml); a laptop
      # wants the sandbox and says so explicitly. Enabling iyzico here still requires real sandbox
      # credentials via IYZICO_API_KEY/IYZICO_SECRET_KEY — the validator refuses blanks.
      base-url: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
  ratelimit:
    # C6. The base default is 1, which describes the documented prod shape: one TLS-terminating
    # proxy that appends the address it saw, so the rightmost X-Forwarded-For entry is trustworthy.
    # A laptop and a CI runner have no proxy in front of them at all, and inheriting that default
    # there means the header is honoured on a directly exposed listener — every caller then picks
    # its own bucket just by rotating it. Live-proven: six unthrottled login attempts with a
    # rotating rightmost entry, the IP limit gone entirely. 0 means "no proxy": ignore the header
    # and charge the transport peer.
    trusted-proxy-count: ${RATE_LIMIT_TRUSTED_PROXY_COUNT:0}
  security:
    # Swagger UI is served by this application in dev and needs its own scripts/styles/images.
    # Prod keeps the strict "default-src 'none'" policy from application.yml.
    content-security-policy: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
