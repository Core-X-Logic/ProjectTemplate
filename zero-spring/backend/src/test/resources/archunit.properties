# Q-01 — ArchUnit freeze store configuration.
#
# The five rules in com.mycompanyname.zero.architecture are checked through FreezingArchRule:
# violations that already existed when the rules landed are recorded in archunit_store/ and
# tolerated; any NEW violation fails the build.
#
# Path is relative to the working directory, which Surefire sets to ${basedir} (zero-spring/backend).
freeze.store.default.path=archunit_store

# false on purpose. If the store is missing, ArchUnit must FAIL rather than helpfully create an
# empty one — an auto-created store silently re-freezes every existing violation and the build goes
# green having checked nothing. To (re)create it deliberately:
#   ./mvnw -B -ntp test -Dtest=ArchitectureRulesTest \
#          -Darchunit.freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreCreation=false

# true on purpose: this is the ratchet. When a frozen violation is fixed, ArchUnit drops it from the
# store on the next run, so the allowance shrinks and cannot grow back. Commit the shrunken store
# together with the fix.
freeze.store.default.allowStoreUpdate=true

# Never blanket-refreeze. Set on the command line for a one-off rebaseline, never in this file.
freeze.refreeze=false
