spring:
  cache:
    type: simple
  datasource:
    hikari:
      # The suite caches many distinct Spring contexts (every @SpringBootTest property permutation is
      # its own), and each holds its OWN Hikari pool against the ONE shared Postgres container. The
      # base min-idle of 5 makes every cached-but-idle context hoard 5 connections for the whole run,
      # so once there are enough contexts Postgres runs out (max_connections=100): "FATAL: sorry, too
      # many clients already", and a late-building context fails to start. Hold no idle connections and
      # reap used ones quickly, so an inactive context frees its slots for the next; max-pool-size stays
      # at the base 10 so the parallel-request ITs (TwoFactorConcurrencyIT et al.) keep their headroom.
      minimum-idle: 0
      idle-timeout: 10000
  jpa:
    properties:
      hibernate:
        query:
          # Q-03 sinif kapatmasi. ArchUnit Rule 1 yalniz `@EntityGraph` + `Pageable` seklini
          # gorur; ayni bellekte-sayfalama hatasi `@Query("... join fetch ...")` + `Pageable`
          # ile de uretilir ve kuraldan SESSIZCE gecer — yani kural goremedigi bir sekli
          # onayliyor. Bu ayar Hibernate'i loglamak yerine FIRLATMAYA zorlar ve seklin
          # tamamini yakalar.
          #
          # Yalnizca TEST profilinde: uretimde firlatmak, bir performans sorununu kesintiye
          # cevirirdi. Testte ise gurultulu basarisizlik tam olarak istenen sey.
          fail_on_pagination_over_collection_fetch: true
management:
  health:
    redis:
      enabled: false
zero:
  jwt:
    # Test-only signing key (base64, 79 bytes). Distinct from the dev key and from the leaked
    # default that PROD-R1 flagged; all three are rejected under the 'prod' profile.
    secret: emVyby1wbGF0Zm9ybS1BVVRPTUFURUQtVEVTVC1PTkxZLXNpZ25pbmcta2V5LW5ldmVyLWRlcGxveWVkLTAxMjM0NTY3ODlhYmNkZWZnaA==
    revocation:
      # PROD-R16: OFF for the general suite so no IT needs a Redis container and no authenticated
      # request fails closed against an absent Redis. TokenRevocationIT and TokenRevocationDegradeIT
      # opt back in with enabled=true (a Redis Testcontainer / an unreachable Redis respectively), the
      # same pattern zero.ratelimit.redis.enabled uses.
      enabled: false
  crypto:
    # Test-only AES-256 field-encryption key (base64, 32 bytes). Distinct from the dev key; both are
    # in FieldEncryptionKeyValidator.NON_PRODUCTION_KEYS and rejected under the 'prod' profile.
    field-key: emVyby1GSUVMRC1FTkMtVEVTVC1uZXZlci1kZXBsb3k=
  seed:
    # B4: base is now `false`, so the suite has to ask for seeding. Every IT logs in as the seeded
    # admin, so this is load-bearing rather than decorative.
    enabled: true
    host-admin-password: Admin123!
  cors:
    # CorsPolicyIT drives a preflight from this origin and asserts an unlisted one is refused.
    allowed-origins: https://app.test.example.com
  ratelimit:
    # Left ENABLED so the whole suite runs through the filter and proves it is transparent, but
    # raised far above what the suite generates. RateLimitIT lowers it in its own context.
    enabled: true
    capacity: 10000
    redis:
      # PROD-R6 (distributed): OFF for the general suite so no IT needs a Redis container — the
      # throttle runs purely per-instance here, which is the pre-PROD-R6 behaviour and exactly what
      # the existing filter tests assert. The distributed store and its degrade path get their own
      # container-backed coverage (DistributedRateLimitIT) and a unit-level degrade test
      # (RateLimitDegradeTest); DistributedRateLimitWiringIT opts back in with `enabled=true` and a
      # Redis Testcontainer to prove the Spring wiring end to end.
      enabled: false
  billing:
    iyzico:
      # P2'-B: never the production host in a test JVM, even though the provider ITs fake both
      # live calls through the SPI — a defence against the next test that forgets to.
      base-url: https://sandbox-api.iyzipay.com
    reconciliation:
      # Same rule as zero.saas.lifecycle below: the suite drives the pass explicitly
      # (BillingReconciliationJobIT); the scheduler must not race the assertions.
      initial-delay: PT24H
      interval: PT24H
  saas:
    lifecycle:
      # The suite drives the lifecycle explicitly; pushing the schedule far out keeps the job from
      # racing the assertions. ShedLockIT still calls the locked method directly.
      initial-delay: PT24H
      interval: PT24H
